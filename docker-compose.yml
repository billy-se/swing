services:
  redis:
    image: redis:7-alpine
    container_name: docker-vaine-redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: docker-vaine-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
      - -c
      - idle_in_transaction_session_timeout=5000
      - -c
      - work_mem=4MB
    restart: always

  backend:
    build:
      context: ./core/backend
      dockerfile: Dockerfile
    volumes:
      - ./core/backend:/app
    container_name: docker-vaine-backend
    ports: 
      - "2026:2026"
    depends_on:
      - postgres
      - redis
    restart: always

  frontend:
    build:
      context: ./core/frontend
      dockerfile: Dockerfile
    container_name: docker-vaine-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:2026
    depends_on:
      - backend
    restart: always
  
  k6:
    image : grafana/k6:latest
    volumes:
      - .:/workspace
    working_dir: /workspace/core/backend/test
    command: run test.js
    depends_on:
      - backend
volumes:
  pgdata:
